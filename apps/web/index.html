<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale and no user-scalable=no: pinch zoom is an
         accessibility feature, and a status page is read in bad light on a
         phone more often than anywhere else. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <!-- Matches --color-bg in the dark theme, not the brand ink: this paints the
         browser's own chrome, and a bar in a different blue from the page under
         it reads as a rendering fault. -->
    <meta name="theme-color" content="#0B1323" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#EDF2F5" media="(prefers-color-scheme: light)" />
    <title>Status — TERN</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
