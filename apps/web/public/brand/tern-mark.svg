<!--
  TERN — the mark.

  A monoline tern head: one continuous stroke from nape to beak, with the eye as
  a separate dot. Taken from the logo system sheet in this directory, which is
  the reference; this file is the working asset.

  Drawn on the system's own 160 grid rather than rescaled to 24, so the
  coordinates stay identical to the source and nothing drifts through rounding.

  Painted in currentColor: on a status page the mark sits on a light surface, a
  dark one and a coloured one, and it should inherit rather than fight the theme.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none"
     role="img" aria-label="TERN">
  <path d="M30 112 C19 86 30 50 62 44 C84 40 96 50 98 60 L130 66 L98 72"
        stroke="currentColor" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="76" cy="59" r="4.5" fill="currentColor" />
</svg>
