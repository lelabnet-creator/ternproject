<!--
  The mark in its container — the form used for app icons, avatars and anywhere
  the logo needs to sit on an unknown background.

  Inverse (white on ink) rather than the light variant, because a badge is most
  often placed against surfaces it does not control, and the dark container
  carries its own contrast with it.

  Corner radius is 40 on 160 — one quarter — exactly as the system sheet draws it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160"
     role="img" aria-label="TERN">
  <rect width="160" height="160" rx="40" fill="#0D2A3F" />
  <path d="M30 112 C19 86 30 50 62 44 C84 40 96 50 98 60 L130 66 L98 72"
        fill="none" stroke="#FFFFFF" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="76" cy="59" r="4.5" fill="#FFFFFF" />
</svg>
