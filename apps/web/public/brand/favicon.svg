<!--
  Favicon.

  The 24px reduction rules from the logo system apply here more than anywhere: a
  tab icon renders at 16px, so the stroke is thickened and the eye dropped. At
  that size the eye is a smudge, and the sheet says to remove it rather than
  shrink it.

  Theme handling travels inside the file because a browser tab cannot hand an
  icon a CSS variable. The badge form is used in both themes — the container
  carries its own contrast, so the mark never disappears against a tab bar of
  either colour.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="TERN">
  <style>
    .bg { fill: #0D2A3F; }
    .fg { stroke: #FFFFFF; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #EDF2F5; }
      .fg { stroke: #0D2A3F; }
    }
  </style>
  <rect class="bg" width="160" height="160" rx="40" />
  <path class="fg"
        d="M30 112 C19 86 30 50 62 44 C84 40 96 50 98 60 L130 66 L98 72"
        fill="none" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round" />
</svg>
