# TERN — a complete instance.
#
#   ./scripts/setup.sh            (asks the questions, writes .env, starts this)
#   docker compose -f docker-compose.prod.yml up -d
#
# Distinct from docker-compose.yml, which is the *development* stack: that one
# exposes a database on a host port and a mail catcher, and expects the app to
# be run from source with `pnpm dev`. This one runs the app itself and publishes
# nothing but the app.

# A project name of its own. `docker-compose.yml` already claims `tern`, and two
# compose files sharing a project name means the one you start second recreates
# the other's containers and adopts its volumes — on a developer's machine that
# quietly destroys the local database.
name: tern-prod

services:
  db:
    # The -ha image, as in the dev stack: it carries timescaledb_toolkit, and
    # migrations stop on an unknown function without it.
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tern
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tern}
      POSTGRES_DB: tern
      LANG: C.UTF-8
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - timescaledb.telemetry_level=off
    # No `ports:` on purpose. The app reaches the database over the compose
    # network, and a database on a host port is both an exposure and the cause
    # of the collision that a machine already running PostgreSQL will hit.
    volumes:
      # `/home/postgres/pgdata`, not `/var/lib/postgresql/data`. That is where
      # `timescaledb-ha` puts `PGDATA`; the conventional path belongs to the
      # plain `postgres` image and this one never writes to it. Mounting the
      # wrong one looked correct and did nothing — the cluster lived in the
      # container's writable layer, so every `docker compose up -d` that
      # recreated the container destroyed the database. `setup.sh` refuses to
      # start on an installation still holding its data that way.
      - db-data:/home/postgres/pgdata
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tern -d tern']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    # Built from this checkout by default. Set TERN_IMAGE to a published tag —
    # ghcr.io/lelabnet-creator/ternproject:1.0.0 — to run a released image
    # instead; `scripts/setup.sh` then pulls rather than builds.
    #
    # `build:` stays declared either way so a modified checkout still works
    # without editing this file.
    image: ${TERN_IMAGE:-tern:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # `db` is the compose service name; 5432 is the in-network port, which is
      # unaffected by whatever the host has on 5432 or 5433.
      DATABASE_URL: postgres://tern:${POSTGRES_PASSWORD:-tern}@db:5432/tern

      # Left unset, the entrypoint generates one into the tern-data volume and
      # reuses it on every later boot.
      APP_SECRET: ${APP_SECRET:-}

      API_PORT: 3011
      API_HOST: 0.0.0.0
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Must be the URL a browser actually uses: it signs cookies, builds the
      # QR pairing URLs and is baked into the generated install scripts.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}

      # Set behind a reverse proxy, or rate limits and the audit log key on the
      # proxy's own address.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-TERN Status <status@example.com>}

      INGEST_RATE_LIMIT_MAX: ${INGEST_RATE_LIMIT_MAX:-600}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}

      # The other three limits, which used to be absent from this list.
      #
      # `config.ts` reads them and `docs/operations.md` documents them, so
      # setting one in `.env` looked like it worked and did nothing at all —
      # compose only forwards what is named here. The default is repeated on
      # each rather than left to the application, so this file says what the
      # instance will actually run with.
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      PAIR_RATE_LIMIT_MAX: ${PAIR_RATE_LIMIT_MAX:-10}
      SUBSCRIBE_RATE_LIMIT_MAX: ${SUBSCRIBE_RATE_LIMIT_MAX:-5}

      # Where the API writes `agent.toml` for the sidecar. The sidecar already
      # declared it; the API did not, so the two could disagree about the one
      # path that connects them. `TERN_LOCAL_AGENT` is set further down, beside
      # the note explaining why supervision is off here.
      TERN_DATA_DIR: ${TERN_DATA_DIR:-/var/lib/tern}

      # Read once, by the entrypoint, to create the status page. Harmless to
      # leave in place: provisioning never touches a tenant that already exists.
      #
      # TERN_ADMIN_* are optional and normally absent: the administrator is
      # created on the first visit to the admin. Set them only for an instance
      # that will be reachable before anyone opens it — they close the first-run
      # window before the first request is served.
      TERN_TENANT_SLUG: ${TERN_TENANT_SLUG:-}
      TERN_TENANT_NAME: ${TERN_TENANT_NAME:-}
      TERN_ADMIN_EMAIL: ${TERN_ADMIN_EMAIL:-}
      TERN_ADMIN_NAME: ${TERN_ADMIN_NAME:-}
      TERN_ADMIN_PASSWORD: ${TERN_ADMIN_PASSWORD:-}
      TERN_DEFAULT_LOCALE: ${TERN_DEFAULT_LOCALE:-en}
      TERN_DEFAULT_TIMEZONE: ${TERN_DEFAULT_TIMEZONE:-UTC}

      # The agent shares this container's network namespace by default, so the
      # address the API writes into agent.toml — http://127.0.0.1:3011 — is
      # already correct. See the `agent` service below for why it is worth
      # arranging that, and what the other mode changes.
      TERN_LOCAL_AGENT: ${TERN_LOCAL_AGENT:-true}

      # Which network the agent watches from, and where it reports.
      #
      # These two travel together and must agree. `service:app` puts the agent
      # in this container's namespace, where 127.0.0.1:3011 is the API. `host`
      # puts it in the machine's, where the API is only reachable at the
      # published port — so the address has to be given, and it is the one thing
      # that makes the switch work at all.
      #
      # TERN_LOCAL_AGENT_SERVER was read by config.ts and documented, and was
      # missing from this list: setting it in .env did nothing, exactly like the
      # three rate limits above before ee55bfb. Named here, it works.
      TERN_AGENT_NETWORK_MODE: ${TERN_AGENT_NETWORK_MODE:-service:app}
      TERN_LOCAL_AGENT_SERVER: ${TERN_LOCAL_AGENT_SERVER:-}
      # The `agent` service below runs the binary and Docker supervises it, so
      # this process must not also start one. Running from source there is no
      # container to do it, which is why the default is the other way round.
      TERN_LOCAL_AGENT_SUPERVISE: 'false'
    ports:
      - '${TERN_HTTP_PORT:-8080}:3011'
    volumes:
      # Holds the generated APP_SECRET. Losing it makes every encrypted value
      # — TOTP secrets, probe auth headers, subscriber addresses — unreadable,
      # so it belongs in the backup next to the database dump.
      #
      # Also how agent.toml reaches the agent: the API writes it here, and the
      # agent container mounts the same volume.
      - tern-data:/var/lib/tern

  # The instance's own agent.
  #
  # Same image, different command — it needs no second build, and shipping one
  # image keeps the agent's version and the server's necessarily identical.
  #
  # Its own service rather than a child of the API, because the point of a
  # separate process is that it keeps measuring and buffering to disk while the
  # API restarts. `restart: unless-stopped` is the supervisor; there is no
  # supervision code anywhere in this project.
  agent:
    # La même que `app`, et écrite ici explicitement. Sans cette ligne le
    # service n'a pas d'image nommée, Compose en déduit qu'il doit la
    # construire, et l'installation reconstruit ce que TERN_IMAGE venait
    # précisément d'éviter — quand elle le peut : hors d'un checkout il n'y a
    # ni Dockerfile ni sources, et le démarrage échoue.
    image: ${TERN_IMAGE:-tern:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ['/usr/bin/tini', '--', '/usr/local/bin/tern-agent-entrypoint']
    # Cleared, or the image's CMD — the API's own start command — would be
    # handed to the entrypoint above as arguments it has no use for.
    command: []
    # The image's healthcheck curls the API's /health. Sharing the API's network
    # namespace, that check would actually succeed here — and would then report
    # the *API's* health as the agent's, which is worse than no check at all.
    # Whether the agent is reporting is a question the fleet screen answers.
    healthcheck:
      disable: true
    # Where the agent watches from. This one line decides what it can measure.
    #
    # `service:app` (the default) puts it in the API's network namespace rather
    # than beside it on the compose network. `tern-agent` refuses to send an
    # ingest key over plain HTTP to anything but localhost, which is a guard
    # worth keeping — so pointing it at `http://app:3011` made it exit on
    # startup, over and over. The choice was to weaken the guard or to make its
    # exemption true, and this is the second: with a shared namespace
    # `127.0.0.1:3011` *is* the API, the key never touches a network interface,
    # and the agent's own default address is already right.
    #
    # What that costs, measured rather than assumed: outbound works fully — DNS,
    # TCP and HTTPS all reach the internet — but `127.0.0.1` means *this
    # container*, so a service listening only on the machine's loopback has no
    # address the agent could even name, and other Docker networks are cut off
    # by bridge isolation. Someone monitoring their own machine writes
    # `localhost:5432`, and that is precisely the target this mode cannot see.
    #
    # `host` is the other answer: the agent joins the machine's stack, where
    # `127.0.0.1` is the machine. Loopback services, other Docker networks and
    # the LAN all become reachable. The guard still holds — the agent then
    # reports to the published port on the host's own loopback, which is why
    # TERN_LOCAL_AGENT_SERVER above is not optional in that mode. Linux only:
    # Docker Desktop does not give host networking the meaning expected here.
    #
    # Either way this container publishes no ports and needs none — `ports` is
    # not permitted with a shared namespace, and the API already publishes the
    # only one.
    network_mode: ${TERN_AGENT_NETWORK_MODE:-service:app}
    environment:
      TERN_DATA_DIR: /var/lib/tern
    volumes:
      # The same volume the API writes agent.toml into — that file is the whole
      # channel between them. Mounted read-write because the agent keeps its
      # offline queue here, which is the one thing in this directory that is
      # its own.
      - tern-data:/var/lib/tern

  # Applying an upgrade, from the admin, without a shell on the host.
  #
  # ── Why this is a container of its own ────────────────────────────────────
  # Because the Docker socket is root on the host, and the process that answers
  # HTTP must never be the one holding it. The API detects that a newer image
  # exists — that is only an outbound GET to a registry — and then writes what
  # it wants into `update.request` in the shared volume. This reads it, decides,
  # and reports back through `update.status.json`. The API cannot pull, cannot
  # recreate anything, and cannot make this do something it does not agree to.
  #
  # It is also the only arrangement that can finish the job: the last step
  # replaces the `app` container, and a process cannot outlive its own removal.
  #
  # ── Off unless asked for ──────────────────────────────────────────────────
  # Behind a profile, so `docker compose up -d` never starts it by accident.
  # Nothing about a status page requires the ability to restart the machine it
  # runs on, and an instance without this service simply shows the two commands
  # to type instead. Enabling it is two lines:
  #
  #   mkdir -p docker/updater && curl -fsSL -o docker/updater/updater.sh \
  #     https://raw.githubusercontent.com/lelabnet-creator/ternproject/main/docker/updater/updater.sh
  #   docker compose -f docker-compose.prod.yml --profile updater up -d
  #
  # The script is mounted from the host, read-only, and deliberately not shipped
  # inside the TERN image or written into the shared volume: either would mean a
  # compromised web server could edit the file that runs as root on the host,
  # which is the exact escalation this whole arrangement exists to prevent. What
  # is mounted here is a file the operator downloaded and can read.
  updater:
    image: docker:27-cli
    restart: unless-stopped
    profiles: ['updater']
    # `docker:cli`'s own entrypoint expects to be a docker client invocation.
    entrypoint: ['/bin/sh', '/deploy/docker/updater/updater.sh']
    environment:
      TERN_DATA_DIR: /var/lib/tern
      TERN_DEPLOY_DIR: /deploy
    volumes:
      # Root on the host, and the reason for every other line in this service.
      - /var/run/docker.sock:/var/run/docker.sock
      # The channel. Read-write because the status and the heartbeat are written
      # here; the request is only ever read.
      - tern-data:/var/lib/tern
      # Read-only: this is the program, and it should not be able to rewrite
      # itself any more than the API should.
      - ./docker/updater/updater.sh:/deploy/docker/updater/updater.sh:ro
      # Read-only for the same reason. Compose needs it to recreate `app`.
      - ./docker-compose.prod.yml:/deploy/docker-compose.prod.yml:ro
      # The one thing that is written: TERN_IMAGE, so the tag survives the next
      # `docker compose up -d` somebody types by hand. A single file rather than
      # the directory, so nothing else in the deployment is writable from here.
      - ./.env:/deploy/.env

volumes:
  db-data:
  tern-data:
