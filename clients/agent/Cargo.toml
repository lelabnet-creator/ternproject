[package]
name = "tern-agent"
version = "0.2.1"
edition = "2021"
# 1.82 for `is_some_and`/`is_none_or`: writing around them produces code clippy
# itself flags, and 1.82 is old enough that requiring it costs nobody anything.
rust-version = "1.82"
license = "AGPL-3.0-or-later"
description = "TERN status agent — runs declarative probes and pushes results."
repository = "https://github.com/lelabnet-creator/ternproject"

# Two binaries from one crate: the proxy reuses the agent's transport, queue and
# job types rather than reimplementing them, which is what keeps the two ends of
# the same protocol from drifting.
[[bin]]
name = "tern-agent"
path = "src/main.rs"

[[bin]]
name = "tern-proxy"
path = "src/bin/tern-proxy.rs"

[dependencies]
# rustls rather than native-tls: the point of this binary is that it drops onto
# a host with no OpenSSL of the right vintage and simply runs.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "charset",
  "http2",
] }
# `fs` for the file, directory and uptime targets. It is a wrapper over the
# blocking pool rather than new machinery, and it is what keeps a stat on a hung
# NFS mount from stalling every other check on the runtime thread.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
anyhow = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
socket2 = "0.6.5"
# For `flock` alone. Already in the tree through tokio and socket2; named here
# because a direct use deserves a direct line.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# One crypto provider, and it has to be the one `reqwest` already brings.
#
# With default features this pulled `aws-lc-rs` while reqwest pulled `ring`, so
# two providers were enabled on the same `rustls` and no process-level default
# could be resolved. `ClientConfig::builder()` — used by both the `cert` and the
# `wss://` paths — panics in exactly that situation, which meant two of the seven
# target types aborted their task the first time anyone ran one. Nothing caught
# it: neither had a test.
#
# `ring` rather than `aws-lc-rs` because reqwest's choice is the one that cannot
# be changed from here, and because `aws-lc-rs` wants a C toolchain and NASM —
# for a binary whose whole point is that it drops onto a machine unaided.
tokio-rustls = { version = "0.26.4", default-features = false, features = [
  "logging",
  "ring",
  "tls12",
] }
webpki-roots = "1.0.9"
x509-parser = "0.18.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
sha2 = "0.10.9"
if-addrs = "0.15.0"

[dev-dependencies]
rcgen = { version = "0.14.7", default-features = false, features = ["pem", "crypto", "ring"] }
serde_json = "1"

[profile.release]
# A monitoring agent should be small and quiet: one codegen unit and LTO cut the
# binary considerably, and stripping removes symbols nobody debugs in the field.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
