# Development stack for TERN.
#
# `docker compose up -d` gives you everything the app needs locally: a
# TimescaleDB-enabled PostgreSQL and a mail catcher so notification work can be
# verified without sending real email.

name: tern

services:
  db:
    # The -ha image rather than the slim one: it ships timescaledb_toolkit, and
    # the latency bands need percentile aggregates that can be rolled up across
    # buckets. Computing p95 from pre-aggregated min/avg/max is not possible, and
    # scanning raw rows for a 1-year window defeats the point of aggregates.
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tern
      POSTGRES_PASSWORD: tern
      POSTGRES_DB: tern
      # Deterministic ordering keeps seeded data and test assertions stable
      # across machines.
      LANG: C.UTF-8
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - timescaledb.telemetry_level=off
    ports:
      # Host port 5433, not 5432: a developer machine very often already has a
      # PostgreSQL on the default port, and a silent connection to the wrong
      # server is a miserable thing to debug.
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tern -d tern']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Catches every outgoing email. Web UI on http://localhost:8025 — this is how
  # subscriber double opt-in and incident notifications get verified.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    logging:
      driver: none

volumes:
  db-data:
